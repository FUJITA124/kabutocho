<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="複数の証券口座の配当と資産をまとめて管理する台帳">
<meta name="theme-color" content="#14100C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="兜帳">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<style>
/* 画面の土台。claude.ai 版で外側が用意していた分をここで持つ */
:root{
  color-scheme: light;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>兜帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  color-scheme: light;
  --ground:#F1EADC;
  --surface:#FBF7EF;
  --surface-2:#E9E0CE;
  --line:#DCD0B8;
  --line-2:#C2B294;
  --ink:#1E1914;
  --ink-2:#584E40;
  --ink-3:#8A7C68;
  --gold:#8F6A11;
  --gold-2:#BC942B;
  --gold-soft:#EBDCB2;
  --lacquer:#20180F;
  --up:#A82F28;
  --down:#2B4A7E;
  --flat:#8A7C68;
  --warn:#8A5A09;
  --warn-bg:#F6E6C4;
  --warn-line:#D3AC63;
  --s1:#2F5EA8; --s2:#B5322E; --s3:#4E7A33; --s4:#AE7E15;
  --s5:#6E4A9E; --s6:#1B7480; --s7:#8A5324; --s8:#4A5568;
  --grid:#DCD0B8;
  --shadow:0 1px 2px rgba(70,52,20,.07), 0 8px 24px rgba(70,52,20,.06);
  --shadow-s:0 1px 2px rgba(70,52,20,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --ground:#14100C;
    --surface:#1E1813;
    --surface-2:#2A221A;
    --line:#382E23;
    --line-2:#4E4234;
    --ink:#F1E8D6;
    --ink-2:#B6A992;
    --ink-3:#877A66;
    --gold:#D9B44A;
    --gold-2:#EBCE79;
    --gold-soft:#3A2F1B;
    --lacquer:#0C0907;
    --up:#E0685F;
    --down:#8AA6DC;
    --flat:#877A66;
    --warn:#E5BE63;
    --warn-bg:#3A2E15;
    --warn-line:#6B5525;
    --s1:#7FA9E8; --s2:#E0685F; --s3:#8FBF63; --s4:#E0B84A;
    --s5:#B18BE0; --s6:#5CC2CE; --s7:#C98F5A; --s8:#9AA5B5;
    --grid:#332A20;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.34);
    --shadow-s:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --ground:#14100C;
  --surface:#1E1813;
  --surface-2:#2A221A;
  --line:#382E23;
  --line-2:#4E4234;
  --ink:#F1E8D6;
  --ink-2:#B6A992;
  --ink-3:#877A66;
  --gold:#D9B44A;
  --gold-2:#EBCE79;
  --gold-soft:#3A2F1B;
  --lacquer:#0C0907;
  --up:#E0685F;
  --down:#8AA6DC;
  --flat:#877A66;
  --warn:#E5BE63;
  --warn-bg:#3A2E15;
  --warn-line:#6B5525;
  --s1:#7FA9E8; --s2:#E0685F; --s3:#8FBF63; --s4:#E0B84A;
  --s5:#B18BE0; --s6:#5CC2CE; --s7:#C98F5A; --s8:#9AA5B5;
  --grid:#332A20;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.34);
  --shadow-s:0 1px 2px rgba(0,0,0,.4);
}

*{box-sizing:border-box}
html{height:100%}
body{
  height:100%; margin:0; background:var(--ground); color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  font-size:17px; line-height:1.55; -webkit-text-size-adjust:100%;
}
.num{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}

.shell{display:flex;flex-direction:column;height:100%;max-width:680px;margin:0 auto;background:var(--ground);position:relative}

/* ---------- header ---------- */
.hdr{
  display:flex;align-items:center;gap:10px;padding:10px 16px 9px;
  background:var(--lacquer);color:#F1E8D6;
  border-bottom:1px solid rgba(217,180,74,.35);
}
.hdr .mark{width:34px;height:29px;flex:none}
.hdr h1{
  margin:0;font-family:"Shippori Mincho B1",serif;font-weight:700;font-size:22.5px;
  letter-spacing:.22em;color:#EBCE79;line-height:1;padding-top:2px;
}
.hdr .sub{font-size:11.5px;letter-spacing:.3em;color:rgba(241,232,214,.52);margin-left:-4px;padding-top:4px}
.hdr .sp{flex:1}
.iconbtn{
  width:34px;height:34px;display:grid;place-items:center;border-radius:9px;
  color:rgba(241,232,214,.8);border:1px solid rgba(217,180,74,.25);
}
.iconbtn:hover{background:rgba(217,180,74,.14)}

/* ---------- month bar ---------- */
.monthbar{
  display:flex;align-items:center;gap:8px;padding:8px 12px;
  background:var(--surface);border-bottom:1px solid var(--line);
}
.mb-arrow{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--ink-2);border:1px solid var(--line)}
.mb-arrow:hover{background:var(--surface-2)}
.mb-arrow[disabled]{opacity:.3;cursor:default}
.mb-center{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;position:relative}
.mb-label{font-family:"Shippori Mincho B1",serif;font-size:19px;font-weight:600;letter-spacing:.06em}
.mb-state{font-size:12px;letter-spacing:.08em;color:var(--ink-3)}
.mb-state.filled{color:var(--gold)}
.mb-center input[type="month"]{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}

/* ---------- main ---------- */
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 16px 28px}
.sec{margin:0 0 10px;display:flex;align-items:baseline;gap:8px}
.sec h2{
  margin:0;font-family:"Shippori Mincho B1",serif;font-size:14.5px;font-weight:600;
  letter-spacing:.2em;color:var(--ink-2);
}
.sec .rule{flex:1;height:1px;background:var(--line)}
.sec .note{font-size:12.5px;color:var(--ink-3)}
.block{margin-bottom:24px}

/* ---------- hero ---------- */
.hero{
  position:relative;overflow:hidden;border-radius:16px;padding:18px 18px 16px;
  background:var(--lacquer);color:#F1E8D6;box-shadow:var(--shadow);
  border:1px solid rgba(217,180,74,.28);
}
.hero .wm{position:absolute;right:-18px;top:-10px;width:160px;height:136px;opacity:.09}
.hero .k{font-size:12.5px;letter-spacing:.24em;color:rgba(235,206,121,.8)}
.hero .v{font-size:clamp(32px,9.5vw,44px);font-weight:700;line-height:1.1;margin-top:4px}
.hero .v small{font-size:.5em;font-weight:500;opacity:.65;margin-left:3px}
.hero .man{font-size:13.5px;color:rgba(241,232,214,.55);margin-top:2px}
.hero .vrow{display:flex;align-items:center;gap:10px}
.hero .vrow .v{flex:1;min-width:0}
.eye{
  flex:none;width:40px;height:40px;display:grid;place-items:center;border-radius:11px;
  color:rgba(241,232,214,.78);border:1px solid rgba(217,180,74,.32);background:rgba(241,232,214,.06);
}
.eye:hover{background:rgba(217,180,74,.16);color:#EBCE79}
.eye[aria-pressed="true"]{background:rgba(217,180,74,.2);color:#EBCE79;border-color:rgba(217,180,74,.55)}
.hero .row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:14px}
.hero .yoc{margin-left:auto;text-align:right;font-size:12.5px;color:rgba(241,232,214,.6);white-space:nowrap}
.hero .yoc b{display:block;font-size:17px;font-weight:700;color:#EBCE79;margin-top:1px}
.hero .pill{
  display:inline-flex;align-items:baseline;gap:6px;padding:5px 10px;border-radius:999px;
  background:rgba(241,232,214,.08);border:1px solid rgba(241,232,214,.14);font-size:13.5px;
}
.hero .pill b{font-size:15.5px;font-weight:700}

/* ---------- tiles ---------- */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
@media (min-width:560px){
  .grid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .grid.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .grid.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
  /* 広い画面では4列になり、タイル1枚の幅は携帯より狭い。桁の多い金額が切れないように */
  .tile .v{font-size:18px}
}
.tile{
  background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:11px 12px 10px;display:flex;flex-direction:column;gap:1px;min-width:0;
}
.tile .k{font-size:12px;letter-spacing:.06em;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 2列に並ぶタイルは幅が狭いので、桁の多い金額が切れないところまで */
.tile .v{font-size:19px;font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v small{font-size:.62em;font-weight:500;color:var(--ink-2);margin-left:2px}
.tile .d{font-size:12.5px;margin-top:2px}
.tile.wide{grid-column:span 2}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--flat)}

/* ---------- goal ---------- */
.goal{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 14px}
.goal .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13.5px;color:var(--ink-2)}
.goal .bar{height:9px;border-radius:5px;background:var(--surface-2);margin-top:9px;overflow:hidden;border:1px solid var(--line)}
.goal .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-2))}
.goal .btm{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-3);margin-top:6px}

/* ---------- broker table ---------- */
.btable{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mixbar{display:flex;height:10px;gap:2px;padding:0;background:var(--surface-2)}
.mixbar i{display:block;height:100%}
.brow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:13px 14px;border-top:1px solid var(--line)}
.brow:first-of-type{border-top:0}
.brow .nm{display:flex;align-items:center;gap:8px;font-size:16.5px;font-weight:600;min-width:0}
.brow .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
.brow .mv{text-align:right;font-size:18px;font-weight:700}
/* 数字が長いので、明細の2行は横幅いっぱいに置く */
.brow .m2,.brow .m3{grid-column:1 / -1;text-align:left}
.brow .m2{font-size:13.5px;color:var(--ink-3)}
.brow .m3{font-size:14px;font-weight:500}

/* ---------- buys list ---------- */
.buylist{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.buyrow{display:flex;align-items:center;gap:10px;padding:10px 13px;border-top:1px solid var(--line)}
.buyrow:first-child{border-top:0}
.buyrow .nm{flex:1;min-width:0}
.buyrow .nm b{display:block;font-size:15.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.buyrow .nm small{font-size:12.5px;color:var(--ink-3)}
.buyrow .am{text-align:right;font-size:16px;font-weight:700;white-space:nowrap}
.buyrow .am small{display:block;font-size:12px;font-weight:400;color:var(--ink-3)}
.buytotal{display:flex;justify-content:space-between;padding:10px 13px;background:var(--surface-2);font-size:14.5px;font-weight:700}

/* ---------- entry form ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:13px;margin-bottom:11px;box-shadow:var(--shadow-s)}
.card .chd{display:flex;align-items:center;gap:8px;margin-bottom:11px}
.card .chd .nm{font-size:16px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .chd .st{font-size:12px;padding:2px 7px;border-radius:999px;background:var(--surface-2);color:var(--ink-3)}
.card .chd .st.ok{background:var(--gold-soft);color:var(--gold)}
.modes{display:flex;align-items:center;gap:6px;margin:-4px 0 11px;font-size:12px;color:var(--ink-3)}
.modes button{
  padding:4px 10px;border-radius:7px;border:1px solid var(--line-2);
  font-size:13px;color:var(--ink-2);background:var(--ground);
}
.modes button[aria-pressed="true"]{background:var(--lacquer);color:#EBCE79;border-color:var(--lacquer);font-weight:700}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.f label{font-size:12px;color:var(--ink-3);letter-spacing:.04em;display:flex;justify-content:space-between;gap:4px}
.f label em{font-style:normal;color:var(--ink-3);opacity:.85}
.f .wrap{position:relative;display:flex;align-items:center}
.f .unit{position:absolute;left:9px;font-size:13.5px;color:var(--ink-3);pointer-events:none}
.f input{
  width:100%;padding:9px 9px 9px 22px;border:1px solid var(--line-2);border-radius:9px;
  background:var(--ground);text-align:right;font-size:17.5px;font-weight:600;
  font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;
}
.f input.nounit{padding-left:9px}
/* 数値欄。スマホは自前の数字パッド、パソコンは数字キーのみ受け付ける */
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.echo{font-size:12px;color:var(--ink-2);padding:3px 1px;white-space:nowrap;letter-spacing:.02em}
.echo:empty{display:none}
.f input::placeholder{font-weight:400;color:var(--ink-3);opacity:.6}
.f input:focus{border-color:var(--gold);background:var(--surface)}
.f .hint{display:flex;gap:5px;flex-wrap:wrap;min-height:0}
.sug{
  font-size:12px;padding:3px 7px;border-radius:7px;border:1px dashed var(--line-2);
  color:var(--ink-2);background:transparent;white-space:nowrap;
}
.sug:hover{border-style:solid;border-color:var(--gold);color:var(--gold)}
.sug.warn{border-color:var(--warn);background:var(--warn-bg);color:var(--warn);border-style:solid;cursor:default}
.csum{display:flex;justify-content:space-between;gap:8px;margin-top:10px;padding-top:9px;border-top:1px dashed var(--line);font-size:13px;color:var(--ink-3)}
.csum b{color:var(--ink-2)}

/* 今月の買付の合計・予定額・残り */
.buysum{margin-top:12px;padding-top:11px;border-top:1px dashed var(--line);display:grid;gap:8px}
.buysum .r{display:flex;align-items:center;justify-content:space-between;gap:10px}
.buysum .r>span{font-size:13px;color:var(--ink-3);white-space:nowrap}
.buysum .r b{font-size:19px;font-weight:700;white-space:nowrap}
.buysum .r input{
  width:150px;max-width:55%;padding:5px 9px;border:1px solid var(--line-2);border-radius:8px;
  background:var(--ground);text-align:right;font-size:19px;font-weight:700;
  font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;
}
.buysum .r input:focus{border-color:var(--gold);background:var(--surface)}

/* 検討中の銘柄 */
.watch{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:13px;margin-bottom:11px;box-shadow:var(--shadow-s)}
.watch.hit{border-color:var(--gold);background:linear-gradient(0deg,var(--gold-soft),var(--gold-soft)),var(--surface)}
.watch .whd{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.watch .whd .nm{font-size:15.5px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.chip.buy{background:var(--gold);color:#1E1813}
.chip.wait{background:var(--surface-2);color:var(--ink-3);font-weight:500}
.chip.done{background:var(--surface-2);color:var(--gold);font-weight:700}
.watch .wsum{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:10px;padding-top:9px;border-top:1px dashed var(--line);font-size:13px;color:var(--ink-3)}
.watch .wsum b{color:var(--ink-2)}
.wrow{display:flex;align-items:center;gap:9px;padding:11px 13px;border-top:1px solid var(--line)}
.wrow:first-child{border-top:0}
.wrow .nm{flex:1;min-width:0}
.wrow .nm b{display:block;font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrow .nm small{font-size:12px;color:var(--ink-3)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:9px 14px;border-radius:10px;border:1px solid var(--line-2);
  background:var(--surface);font-size:14.5px;font-weight:500;color:var(--ink);
}
.btn:hover{border-color:var(--gold);color:var(--gold)}
.btn.primary{background:var(--lacquer);color:#EBCE79;border-color:var(--lacquer)}
.btn.primary:hover{background:#2C2115;color:#F2DA94}
.btn.danger:hover{border-color:var(--up);color:var(--up)}
.btn.block{width:100%}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}

.brow-in{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.brow-in:first-child{border-top:0}
.brow-in .full{grid-column:span 2}
.brow-in select,.brow-in input{
  width:100%;padding:8px 9px;border:1px solid var(--line-2);border-radius:9px;background:var(--ground);font-size:16px;
}
.brow-in input.n{text-align:right;font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;font-weight:600}
.brow-in .del{justify-self:end;font-size:13px;color:var(--ink-3);padding:4px 8px;border-radius:7px}
.brow-in .del:hover{color:var(--up);background:var(--surface-2)}
.brow-in .lbl{font-size:12px;color:var(--ink-3);margin-bottom:3px}

/* ---------- charts ---------- */
.chart{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 10px 8px;margin-bottom:14px}
.chart .ct{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:0 4px 2px}
.chart .ct h3{margin:0;font-size:14px;font-weight:700;letter-spacing:.04em}
.chart .ct span{font-size:12px;color:var(--ink-3)}
.legend{display:flex;flex-wrap:wrap;gap:10px;padding:2px 4px 8px;font-size:12.5px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.legend i.dashed{height:0;border-top:2px dashed currentColor;border-radius:0}
.tip{
  position:absolute;pointer-events:none;z-index:5;background:var(--lacquer);color:#F1E8D6;
  border:1px solid rgba(217,180,74,.35);border-radius:9px;padding:7px 9px;font-size:13px;
  box-shadow:var(--shadow);white-space:nowrap;opacity:0;transition:opacity .1s;
}
.tip b{display:block;font-size:12px;color:rgba(235,206,121,.85);letter-spacing:.08em;margin-bottom:3px}
.tip .l{display:flex;align-items:center;gap:6px;justify-content:space-between}
.tip .l i{width:8px;height:8px;border-radius:2px;flex:none}
.tip .l span{margin-left:auto;font-weight:700}
svg{display:block;max-width:100%}
.ctext{font-size:11.5px;fill:var(--ink-3);font-family:"JetBrains Mono",ui-monospace,monospace}

/* ---------- history table ---------- */
.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.hist{border-collapse:collapse;width:100%;min-width:640px;font-size:13.5px}
table.hist th,table.hist td{padding:8px 10px;text-align:right;white-space:nowrap;border-top:1px solid var(--line)}
table.hist thead th{border-top:0;font-size:12px;color:var(--ink-3);font-weight:500;background:var(--surface-2);position:sticky;top:0}
table.hist th:first-child,table.hist td:first-child{text-align:left;font-weight:600}
table.hist td{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}

/* ---------- settings ---------- */
.srow{display:flex;align-items:center;gap:9px;padding:9px 0;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.srow input[type="text"]{
  flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line-2);border-radius:9px;background:var(--ground);font-size:16px;
}
.srow .x{width:32px;height:32px;flex:none;border-radius:8px;display:grid;place-items:center;color:var(--ink-3);border:1px solid var(--line)}
.srow .x:hover{color:var(--up);border-color:var(--up)}
.seg{display:flex;gap:0;border:1px solid var(--line-2);border-radius:9px;overflow:hidden}
.seg button{flex:1;padding:8px 6px;font-size:14px;color:var(--ink-2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--lacquer);color:#EBCE79;font-weight:700}
textarea.io{
  width:100%;min-height:110px;padding:10px;border:1px solid var(--line-2);border-radius:10px;
  background:var(--ground);font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12.5px;resize:vertical;
}
.help{font-size:13px;color:var(--ink-3);line-height:1.7}
.help b{color:var(--ink-2);font-weight:600}

/* ---------- misc ---------- */
.banner{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:var(--warn-bg);border:1px solid var(--warn-line);
  color:var(--warn);border-radius:11px;padding:9px 12px;font-size:13.5px;margin-bottom:14px;
}
.banner .sp{flex:1}
.banner button{font-size:13.5px;font-weight:700;text-decoration:underline;color:inherit;white-space:nowrap}
.empty{text-align:center;padding:34px 18px;color:var(--ink-3);font-size:14.5px;line-height:1.8}
.empty svg{opacity:.3;margin-bottom:10px}
.saveflag{
  position:absolute;left:50%;transform:translateX(-50%);bottom:12px;z-index:20;
  background:var(--lacquer);color:#EBCE79;font-size:13px;padding:6px 14px;border-radius:999px;
  border:1px solid rgba(217,180,74,.4);opacity:0;transition:opacity .25s;pointer-events:none;
}
.saveflag.on{opacity:1}

/* ---------- 写真から数字を読む ---------- */
.ocr{
  position:fixed;inset:0;z-index:60;background:#14100C;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
.ocr .bar{display:flex;align-items:center;gap:10px;padding:10px 14px;color:#F1E8D6;border-bottom:1px solid rgba(217,180,74,.3)}
.ocr .bar .t{flex:1;font-size:15.5px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ocr .bar button{color:#EBCE79;font-size:14px;padding:7px 13px;border:1px solid rgba(217,180,74,.4);border-radius:9px}
.ocrchips{display:flex;gap:6px;padding:10px 14px;overflow-x:auto}
.ocrchips button{
  white-space:nowrap;padding:8px 13px;border-radius:999px;border:1px solid rgba(217,180,74,.35);
  color:rgba(241,232,214,.75);font-size:13.5px;background:transparent;
}
.ocrchips button[aria-current="true"]{background:#EBCE79;color:#1E1813;font-weight:700;border-color:#EBCE79}
.ocrchips button.done{color:rgba(241,232,214,.4);border-style:dashed}
.ocrstage{flex:1;position:relative;display:grid;place-items:center;overflow:hidden;touch-action:none;background:#0C0907}
.ocrstage canvas{max-width:100%;max-height:100%;display:block;touch-action:none}
.ocrsel{position:absolute;border:2px solid #EBCE79;background:rgba(235,206,121,.2);pointer-events:none;border-radius:2px}
.ocrfoot{
  padding:12px 14px;color:rgba(241,232,214,.82);font-size:13.5px;line-height:1.6;
  border-top:1px solid rgba(217,180,74,.25);min-height:56px;display:flex;align-items:center;gap:10px;
}
.ocrfoot b{color:#EBCE79}
.spin{
  flex:none;width:16px;height:16px;border-radius:50%;border:2px solid rgba(235,206,121,.3);
  border-top-color:#EBCE79;animation:sp .8s linear infinite;
}
@keyframes sp{to{transform:rotate(360deg)}}
.modes .cam{margin-left:auto;border-color:var(--gold);color:var(--gold)}

/* ---------- 数字パッド ---------- */
/* スマホでは OS のキーボードを一切出さず、このパッドだけで数字を入れる。
   日本語入力の変換（辞書登録した店番など）が割り込む余地をなくすため */
.pad{background:var(--surface-2);border-top:1px solid var(--line-2);padding:8px 8px 10px;box-shadow:0 -10px 26px rgba(0,0,0,.13)}
.pad .ph{display:flex;align-items:baseline;gap:10px;padding:1px 6px 8px}
.pad .ph .who{font-size:12.5px;color:var(--ink-3);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pad .ph .val{font-size:17px;font-weight:700;white-space:nowrap}
.pad .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pad .keys button{
  height:46px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);
  font-family:"JetBrains Mono",ui-monospace,monospace;font-size:21.5px;font-weight:700;
  display:grid;place-items:center;touch-action:manipulation;
}
.pad .keys button:active{background:var(--gold-soft);border-color:var(--gold)}
.pad .keys button.act{font-family:inherit;font-size:14.5px;font-weight:500;color:var(--ink-2);background:var(--ground)}
.pad .keys button.done{background:var(--lacquer);color:#EBCE79;border-color:var(--lacquer);font-weight:700}
input[readonly]{cursor:pointer;-webkit-user-select:none;user-select:none}

/* ---------- confirm ---------- */
.mask{position:absolute;inset:0;z-index:40;background:rgba(20,16,12,.55);display:grid;place-items:center;padding:20px}
.dlg{background:var(--surface);border:1px solid var(--line-2);border-radius:14px;padding:16px;max-width:340px;width:100%;box-shadow:var(--shadow)}
.dlg p{margin:0 0 14px;font-size:15.5px;line-height:1.7}
.dlg .row{display:flex;gap:8px}
.dlg .row .btn{flex:1}

/* ---------- tabs ---------- */
.tabs{display:flex;background:var(--surface);border-top:1px solid var(--line)}
.tabs button{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:7px 2px 8px;color:var(--ink-3);font-size:12px;letter-spacing:.08em;
  border-top:2px solid transparent;margin-top:-1px;
}
.tabs button[aria-current="page"]{color:var(--gold);border-top-color:var(--gold)}
.tabs svg{display:block}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

function parseNum(s){
  if (typeof s === "number") return s;
  if (!s) return 0;
  let t = String(s).trim().replace(/[，,¥￥\s円株]/g,"")
    .replace(/[０-９．]/g, c => "０１２３４５６７８９．".indexOf(c) < 10 ? "0123456789".charAt("０１２３４５６７８９".indexOf(c)) : ".");
  const oku = t.indexOf("億"), man = t.indexOf("万");
  if (oku > -1 || man > -1){
    let total = 0;
    if (oku > -1){ total += (parseFloat(t.slice(0,oku))||0) * 1e8; t = t.slice(oku+1); }
    const m2 = t.indexOf("万");
    if (m2 > -1){ total += (parseFloat(t.slice(0,m2))||0) * 1e4; t = t.slice(m2+1); }
    total += parseFloat(t) || 0;
    return Math.round(total);
  }
  const v = parseFloat(t);
  return isFinite(v) ? v : 0;
}

function fmtN(n, d){ if (!isFinite(n)) return "—";
  return new Intl.NumberFormat("ja-JP",{minimumFractionDigits:d||0,maximumFractionDigits:d||0}).format(n); }
function yen(n){ return "¥" + fmtN(Math.round(n||0)); }
function yenShort(n){
  n = Math.round(n||0); const a = Math.abs(n);
  if (a >= 1e8) return (n/1e8).toFixed(2).replace(/\.?0+$/,"") + "億円";
  if (a >= 1e4) return fmtN(n/1e4, a >= 1e7 ? 0 : 1) + "万円";
  return fmtN(n) + "円";
}
function pct(n, d){ return isFinite(n) ? fmtN(n*100, d===undefined?2:d) + "%" : "—"; }
function signed(n){ return (n>0?"+":n<0?"-":"") + fmtN(Math.abs(Math.round(n))); }
function dirClass(n){ return n > 0 ? "up" : n < 0 ? "down" : "flat"; }
/* ▲ は決算書ではマイナスを表す記号なので使わない。符号をそのまま出す。
   色は証券会社の画面にならい プラス＝緋色・マイナス＝藍色。色だけに頼らず必ず符号を添える */
/* 符号は必ず半角。全角の「＋」「−」は等幅フォントに無く日本語書体に落ちるため、
   1文字で数字2文字ぶんの幅を食い、iPad などで桁が「…」に切れる */
function sgnMark(n){ return n > 0 ? "+" : n < 0 ? "-" : ""; }
function gainWord(n){ return n > 0 ? "含み益" : n < 0 ? "含み損" : "増減なし"; }
function yenDelta(n){ return sgnMark(n) + "¥" + fmtN(Math.abs(Math.round(n||0))); }
function numDelta(n){ return sgnMark(n) + fmtN(Math.abs(Math.round(n||0))); }
function ptDelta(n, d){ return sgnMark(n) + fmtN(Math.abs(n)*100, d===undefined?2:d) + "pt"; }
function pctDelta(n, d){ return isFinite(n) ? sgnMark(n) + fmtN(Math.abs(n)*100, d===undefined?2:d) + "%" : "—"; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function seriesColor(i){ return "var(" + SERIES[i % SERIES.length] + ")"; }
function cssVal(v){
  const m = /^var\((--[\w-]+)\)$/.exec(v);
  return m ? getComputedStyle(document.documentElement).getPropertyValue(m[1]).trim() || "#888" : v;
}

/* ============================ 計算 ============================ */
function blankMonth(ym){ return { month: ym, entries: {}, buys: [], received: 0 }; }
function getM(ym){ return state.months[ym] || blankMonth(ym); }
function ensureM(ym){ if (!state.months[ym]) state.months[ym] = blankMonth(ym); return state.months[ym]; }
function entryOf(ym, bid){ return (getM(ym).entries || {})[bid] || {cost:0,value:0,div:0,shares:0}; }
function hasData(ym){
  const m = state.months[ym]; if (!m) return false;
  if ((m.buys||[]).length) return true;
  return Object.values(m.entries||{}).some(e => (e.cost||e.value||e.div||e.shares));
}
function filledMonths(){ return Object.keys(state.months).filter(hasData).sort(); }

function totals(ym){
  const m = getM(ym); let cost=0,value=0,div=0,shares=0;
  for (const b of state.cfg.brokers){
    const e = (m.entries||{})[b.id] || {};
    cost += +e.cost||0; value += +e.value||0; div += +e.div||0; shares += +e.shares||0;
  }
  const invested = (m.buys||[]).reduce((s,x)=>s+(+x.amount||0),0);
  const gain = value - cost;
  return {
    cost, value, div, shares, invested, gain,
    gainRate: cost ? gain/cost : NaN,
    yoc:      cost ? div/cost  : NaN,
    cy:       value ? div/value : NaN,
    avg:      shares ? cost/shares : NaN,
    perShare: shares ? div/shares : NaN,
    perMonth: div/12, perDay: div/365
  };
}
function ytdInvested(ym){
  const y = ym.slice(0,4); let s = 0;
  for (const k of Object.keys(state.months)) if (k.slice(0,4)===y && k <= ym) s += (state.months[k].buys||[]).reduce((a,x)=>a+(+x.amount||0),0);
  return s;
}
function prevFilled(ym){
  const f = filledMonths().filter(k => k < ym);
  return f.length ? f[f.length-1] : null;
}
function delta(cur, prev){ if (!isFinite(prev) || !prev) return NaN; return (cur-prev)/prev; }

/* ---- 目隠し（人に見られそうなときに金額を伏せる。端末ごとの設定） ---- */
const MASK = "••••••";
let maskState = null;   // 端末の保存が使えない場合でも切り替えが効くよう、実体はこちらで持つ
function maskOn(){
  if (maskState === null){
    try { maskState = localStorage.getItem(LS + ".mask") === "1"; } catch(e){ maskState = false; }
  }
  return maskState;
}
function setMask(v){
  maskState = !!v;
  try { localStorage.setItem(LS + ".mask", v ? "1" : "0"); } catch(e){}
}
function hideVal(s){ return maskOn() ? MASK : s; }

/* ---- 今月の買付予定額。月ごとに上書きでき、無ければ設定の既定値を使う ---- */
function budgetOf(ym){
  const m = state.months[ym];
  if (m && m.budget !== undefined && m.budget !== null && m.budget !== "") return +m.budget || 0;
  return +state.cfg.monthlyBudget || 0;
}

/* ---- 検討中の銘柄 ---- */
function watchList(){ return (state.cfg.watch = state.cfg.watch || []); }
function watchNeed(w){ return (+w.price||0) * (+w.qty||0); }      // 希望株価での必要額
function watchNow(w){ return (+w.cur||0) * (+w.qty||0); }          // 現在株価での必要額
function watchHit(w){ return (+w.cur||0) > 0 && (+w.price||0) > 0 && (+w.cur) <= (+w.price); }
function watchBought(w, ym){
  const c = String(w.code||"").trim(), n = String(w.name||"").trim();
  return (getM(ym).buys||[]).some(x =>
    (c && String(x.code||"").trim() === c) || (!c && n && String(x.name||"").trim() === n));
}

/* ============================ サンプル ============================ */
const SAMPLE_BROKERS = [
  {id:"b1", name:"SBI証券"}, {id:"b2", name:"楽天証券"},
  {id:"b3", name:"マネックス証券"}, {id:"b4", name:"松井証券"}
];
const SAMPLE_NAMES = {
  b1:["三菱商事","日本たばこ産業","KDDI"], b2:["三井住友FG","INPEX"],
  b3:["オリックス","伊藤忠商事"], b4:["日本電信電話"]
};
function buildSample(){
  const months = []; for (let i = 5; i >= 0; i--) months.push(ymAdd(ymNow(), -i));
  const cost = {b1:3200000,b2:1850000,b3:940000,b4:620000};
  const shares = {b1:1240,b2:860,b3:410,b4:300};
  const div = {b1:132000,b2:79000,b3:38500,b4:24800};
  const ratio = {b1:1.088,b2:1.062,b3:1.079,b4:1.046};
  const price = {b1:2480,b2:3960,b3:1720,b4:2150};
  const add = {b1:92000,b2:61000,b3:33000,b4:21000};
  const drift = [1, 1.013, 1.004, 1.028, 1.019, 1.037];
  const out = {};
  months.forEach((ym, i) => {
    const buys = [];
    if (i > 0) SAMPLE_BROKERS.forEach((b, bi) => {
      const names = SAMPLE_NAMES[b.id];
      const nm = names[(i - 1 + bi) % names.length];
      const p = price[b.id] + ((i * 37 + bi * 11) % 9) * 10;
      const sh = Math.max(10, Math.round(add[b.id] / p / 10) * 10);
      const amount = sh * p;
      buys.push({id:"s"+i+b.id, name:nm, bid:b.id, amount, shares:sh});
      cost[b.id] += amount; shares[b.id] += sh;
      div[b.id] += Math.round(amount * 0.0405 / 100) * 100;
    });
    const entries = {};
    SAMPLE_BROKERS.forEach(b => {
      entries[b.id] = {
        cost: cost[b.id],
        value: Math.round(cost[b.id] * ratio[b.id] * drift[i] / 1000) * 1000,
        div: div[b.id], shares: shares[b.id]
      };
    });
    out[ym] = { month: ym, entries, buys };
  });
  return { brokers: SAMPLE_BROKERS.map(b=>({...b})), goalDividend: 400000, months: out };
}

/* ============================ 保存 ============================ */
function snapshot(){ return { cfg: state.cfg, months: state.months, demo: state.demo }; }
function saveLocal(){
  try { localStorage.setItem(LS, JSON.stringify(snapshot())); } catch(e){}
}
/* 端末への書き出しは全データの直列化なので、1文字ごとにやると重い。まとめて行う */
let localTimer = null;
function saveLocalSoon(){ clearTimeout(localTimer); localTimer = setTimeout(saveLocal, 500); }
let flagTimer = null;
function flashSaved(txt){
  const el = document.getElementById("saveflag");
  el.textContent = txt || "保存しました"; el.classList.add("on");
  clearTimeout(flagTimer); flagTimer = setTimeout(()=>el.classList.remove("on"), 1400);
}
const queue = new Map(), busy = new Set();
function pushDoc(path, data){
  if (!db) return;
  queue.set(path, data);
  drain(path);
}
async function drain(path){
  if (busy.has(path)) return;
  busy.add(path);
  try {
    while (queue.has(path)){
      const data = queue.get(path); queue.delete(path);
      try { await db.doc(path).set(data); }
      catch(e){
        if (e && e.code === "unavailable"){ await new Promise(r=>setTimeout(r, 400 + Math.random()*400));
          try { await db.doc(path).set(data); } catch(e2){ console.warn("保存できませんでした", e2); }
        } else { console.warn("保存できませんでした", e); }
      }
    }
  } finally { busy.delete(path); }
}
let saveTimer = null;
const savePaths = new Set();
let saveCfgFlag = false;
/* 月の保存と設定の保存は分ける。月を保存するたびに設定まで書き込むと、
   その反響で画面が作り直され、入力中の欄が消えてしまうため */
function scheduleSave(paths, cfg){
  state.demo = false;
  (paths || []).forEach(p => savePaths.add(p));
  if (cfg) saveCfgFlag = true;
  saveLocalSoon();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flushSave, 800);
}
function flushSave(){
  clearTimeout(localTimer); saveLocal();
  if (db){
    if (saveCfgFlag) pushDoc("config/app", clone({ brokers: state.cfg.brokers, goalDividend: state.cfg.goalDividend, tickers: state.cfg.tickers || {}, monthlyBudget: +state.cfg.monthlyBudget || 0, watch: state.cfg.watch || [] }));
    savePaths.forEach(ym => { if (state.months[ym]) pushDoc("months/" + ym.replace("-","_"), clone(state.months[ym])); });
  }
  savePaths.clear(); saveCfgFlag = false;
  flashSaved();
}
function saveMonth(ym){ scheduleSave([ym], false); }
function saveCfg(){ scheduleSave([], true); }

/* ============================ 起動 ============================ */
function boot(){
  let loaded = null;
  try { const raw = localStorage.getItem(LS); if (raw) loaded = JSON.parse(raw); } catch(e){}
  if (loaded && loaded.cfg && loaded.cfg.brokers && loaded.cfg.brokers.length && !loaded.demo){
    state.cfg = loaded.cfg; state.months = loaded.months || {}; state.demo = false;
  } else {
    const s = buildSample();
    state.cfg = { brokers: s.brokers, goalDividend: s.goalDividend, monthlyBudget: 0, tickers: {}, watch: [] };
    state.months = s.months; state.demo = true;
  }
  const f = filledMonths();
  state.month = f.length ? f[f.length-1] : ymNow();
  applyTheme();
  render();
  connect();
}
async function connect(){
  try { db = await claude.use("db"); } catch(e){ db = null; }
  try { downloads = await claude.use("downloads"); } catch(e){ downloads = null; }
  if (state.tab === "set") render();
  if (!db){ dbReady = true; return; }
  db.doc("config/app").onSnapshot(snap => {
    if (snap.exists){
      const d = clone(snap.data()) || {};
      if (Array.isArray(d.brokers) && d.brokers.length){
        const sameList = state.cfg.brokers.length === d.brokers.length
          && state.cfg.brokers.every((b,i) => b.id === d.brokers[i].id && b.name === d.brokers[i].name);
        state.cfg = { brokers: d.brokers, goalDividend: +d.goalDividend || 0, tickers: d.tickers || {}, monthlyBudget: +d.monthlyBudget || 0, watch: Array.isArray(d.watch) ? d.watch : [] };
        state.demo = false;
        dbReady = true; saveLocal();
        if (!sameList || state.tab !== "entry") render();
        return;
      }
      dbReady = true; saveLocal(); render();
    } else {
      dbReady = true;
      if (!state.demo) scheduleSave(Object.keys(state.months), true);  // ローカルの実データをクラウドへ引き上げる
    }
  }, e => { dbReady = true; });
  db.collection("months").onSnapshot(qs => {
    let touched = false;
    // 入力タブで開いている月は、こちらが編集中なので上書きしない
    const openMonth = (state.tab === "entry") ? state.month : editingLock;
    qs.docs.forEach(d => {
      const v = clone(d.data()); if (!v || !v.month) return;
      if (v.month === openMonth) return;
      state.months[v.month] = { month: v.month, entries: v.entries||{}, buys: v.buys||[], received: +v.received||0 };
      touched = true;
    });
    if (touched){ state.demo = false; saveLocal(); render(); }
  }, e => {});
}

/* ============================ テーマ ============================ */
function applyTheme(){
  let t = "system"; try { t = localStorage.getItem(LS + ".theme") || "system"; } catch(e){}
  if (t === "system") delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = t;
}
function cycleTheme(){
  let t = "system"; try { t = localStorage.getItem(LS + ".theme") || "system"; } catch(e){}
  const next = t === "system" ? "light" : t === "light" ? "dark" : "system";
  try { localStorage.setItem(LS + ".theme", next); } catch(e){}
  applyTheme(); render();
  flashSaved(next === "system" ? "端末の設定に合わせます" : next === "light" ? "明るい表示" : "暗い表示");
}

function confirmBox(msg, yesLabel, onYes){
  const mask = document.createElement("div");
  mask.className = "mask";
  mask.innerHTML = '<div class="dlg" role="dialog" aria-modal="true"><p></p>'
    + '<div class="row"><button class="btn" data-no>やめる</button>'
    + '<button class="btn primary" data-yes></button></div></div>';
  mask.querySelector("p").textContent = msg;
  mask.querySelector("[data-yes]").textContent = yesLabel;
  const close = () => mask.remove();
  mask.querySelector("[data-no]").addEventListener("click", close);
  mask.querySelector("[data-yes]").addEventListener("click", () => { close(); onYes(); });
  mask.addEventListener("click", ev => { if (ev.target === mask) close(); });
  document.querySelector(".shell").appendChild(mask);
  mask.querySelector("[data-yes]").focus();
}

/* ============================ 描画 ============================ */
const main = document.getElementById("main");
let entryBuiltFor = "";
/* いま欄に触っている最中か。触っている間は画面を作り直さない */
function busyEditing(){
  if (padTarget && document.contains(padTarget)) return true;
  const a = document.activeElement;
  return !!(a && main.contains(a) && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName));
}

function render(){
  document.getElementById("monthbar").hidden = (state.tab === "set");
  document.querySelectorAll("#tabs button").forEach(b => {
    if (b.dataset.tab === state.tab) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current");
  });
  document.getElementById("mLabel").textContent = ymLabel(state.month);
  document.getElementById("mPick").value = state.month;
  const st = document.getElementById("mState");
  const filled = hasData(state.month);
  st.textContent = filled ? "末日時点 ・ 入力済み" : "末日時点 ・ 未入力";
  st.className = "mb-state" + (filled ? " filled" : "");
  document.getElementById("nextM").disabled = state.month >= ymNow();

  if (state.tab === "entry"){
    const sig = state.month + "|" + state.cfg.brokers.map(b=>b.id+b.name+(b.input||"")).join(",");
    // 入力中の欄があるあいだは何があっても作り直さない
    if (entryBuiltFor !== sig && !busyEditing()){
      entryBuiltFor = sig; diag.rebuild++; main.scrollTop = 0; renderEntry();
    }
    return;
  }
  if (busyEditing()) return;   // 設定などでも、入力中の欄があるあいだは作り直さない
  entryBuiltFor = "";
  closePad();
  if (state.tab === "dash") renderDash();
  else if (state.tab === "trend") renderTrend();
  else renderSettings();
}

/* ---------------- 入力 ---------------- */
/* 数値欄の共通処理。日本語入力を寄せつけない作りにしたうえで、
   カンマ付きや「320万」を貼り付けたときだけ解釈して入れ直す */
function echoText(v, unit){
  if (!v) return "";
  if (unit === "株") return fmtN(v) + " 株";
  return fmtN(v) + " 円" + (Math.abs(v) >= 1e4 ? "（" + yenShort(v) + "）" : "");
}
/* 指で操作する端末か。スマホ・タブレットでは OS のキーボードを出さず自前のパッドを使う */
const TOUCH = !!(window.matchMedia && window.matchMedia("(pointer: coarse)").matches);

/* 数値欄の共通の属性。スマホでは readonly + inputmode="none" で
   OS のキーボード（＝日本語変換）を確実に出さない */
function numAttrs(label, unit, sign){
  return 'type="text" data-numfield data-padlabel="' + esc(label) + '" data-padunit="' + esc(unit||"円") + '"'
    + (sign ? ' data-padsign="1"' : "")
    + ' inputmode="' + (TOUCH ? "none" : "numeric") + '"' + (TOUCH ? " readonly" : "")
    + ' autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"';
}
function wireNum(input, onValue){
  input.__commit = onValue;
  input.addEventListener("paste", ev => {
    const dt = ev.clipboardData; if (!dt) return;
    ev.preventDefault();
    const v = parseNum(dt.getData("text") || "");
    input.value = v ? String(v) : "";
    if (onValue) onValue();
  });
  if (TOUCH){
    input.addEventListener("focus", () => openPad(input));
    input.addEventListener("click", () => openPad(input));
    return;
  }
  // パソコン：数字キー以外は受け付けず、変換が始まってしまった場合は結果を捨てる
  const isCode = input.dataset.padunit === "code";
  let composing = false, good = input.value;
  input.addEventListener("keydown", ev => {
    if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
    const k = ev.key;
    if (k === "Backspace" || k === "Delete" || k === "Tab" || k === "Enter"
        || k === "Home" || k === "End" || k.indexOf("Arrow") === 0) return;
    if (/^[0-9]$/.test(k)) return;
    if (isCode && /^[A-Za-z]$/.test(k)) return;   // 130A のような英字入りコード
    if (k === "-" && input.dataset.padsign === "1"
        && input.selectionStart === 0 && input.value.indexOf("-") < 0) return;
    ev.preventDefault();
  });
  input.addEventListener("compositionstart", () => { composing = true; });
  input.addEventListener("compositionend", () => {
    composing = false;
    input.value = good;
    if (onValue) onValue();
  });
  input.addEventListener("input", () => {
    if (composing) return;
    const sgn = (input.dataset.padsign === "1" && input.value.charAt(0) === "-") ? "-" : "";
    const cleaned = isCode
      ? input.value.toUpperCase().replace(/[^0-9A-Z]/g, "")
      : sgn + input.value.replace(/[^0-9]/g, "");
    if (cleaned !== input.value) input.value = cleaned;
    good = input.value;
    if (onValue) onValue();
  });
}

/* ---------------- 写真から数字を読む ----------------
   証券会社のアプリの画面を撮る（または保存済みの写真を選ぶ）→ 数字を指で囲む →
   囲んだところだけを読み取って欄に入れる。画面全体を解析するより誤読がはるかに少ない。
   読み取り部品は初回だけ通信で取り寄せるため、圏外では使えない。 */
const OCR_CDN = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
let ocrWorker = null, ocrBusy = false, ocrState = null;

const ocrEl    = document.getElementById("ocr");
const ocrFile  = document.getElementById("ocrFile");
const ocrCv    = document.getElementById("ocrCanvas");
const ocrStage = document.getElementById("ocrStage");
const ocrSel   = document.getElementById("ocrSel");
const ocrFoot  = document.getElementById("ocrFoot");

function ocrMsg(text, spinning){
  ocrFoot.innerHTML = (spinning ? '<span class="spin"></span>' : "") + "<span>" + text + "</span>";
}
function ocrFieldsFor(b){
  return (b.input === "gain")
    ? [{k:"value",label:"時価評価額"},{k:"gain",label:"評価損益"},{k:"div",label:"年間配当"},{k:"shares",label:"保有株数"}]
    : [{k:"cost",label:"取得額"},{k:"value",label:"時価評価額"},{k:"div",label:"年間配当"},{k:"shares",label:"保有株数"}];
}
function openOcr(bid){
  const b = state.cfg.brokers.find(v => v.id === bid);
  if (!b) return;
  ocrState = { bid, name: b.name, fields: ocrFieldsFor(b), idx: 0, done: {}, img: null, scale: 1 };
  ocrFile.value = "";
  ocrFile.click();          // iPhone なら「写真を撮る／ライブラリから選ぶ」が出る
}
function closeOcr(){
  ocrEl.hidden = true;
  ocrSel.hidden = true;
  if (ocrState && ocrState.url) URL.revokeObjectURL(ocrState.url);
  ocrState = null;
}
function renderOcrChips(){
  const host = document.getElementById("ocrChips");
  host.innerHTML = ocrState.fields.map((f,i) =>
    '<button type="button" data-ocrfield="' + i + '"'
    + (i === ocrState.idx ? ' aria-current="true"' : "")
    + (ocrState.done[f.k] ? ' class="done"' : "")
    + ">" + esc(f.label) + (ocrState.done[f.k] ? " ✓" : "") + "</button>").join("");
}
ocrFile.addEventListener("change", () => {
  const f = ocrFile.files && ocrFile.files[0];
  if (!f || !ocrState) return;
  const img = new Image();
  ocrState.url = URL.createObjectURL(f);
  img.onload = () => {
    ocrState.img = img;
    ocrEl.hidden = false;
    document.getElementById("ocrTitle").textContent = ocrState.name + " ・ 写真から読み取り";
    requestAnimationFrame(() => {
      drawOcrImage();
      renderOcrChips();
      ocrMsg("読み取りたい数字を、<b>指でなぞって囲んで</b>ください。上の見出しが、いま入れる欄です。");
    });
  };
  img.onerror = () => { closeOcr(); flashSaved("この画像は開けませんでした"); };
  img.src = ocrState.url;
});
function drawOcrImage(){
  const img = ocrState.img;
  const maxW = ocrStage.clientWidth, maxH = ocrStage.clientHeight;
  const s = Math.min(maxW / img.naturalWidth, maxH / img.naturalHeight, 1);
  ocrCv.width = Math.max(1, Math.round(img.naturalWidth * s));
  ocrCv.height = Math.max(1, Math.round(img.naturalHeight * s));
  ocrState.scale = s;
  ocrCv.getContext("2d").drawImage(img, 0, 0, ocrCv.width, ocrCv.height);
}
/* 指でなぞって範囲を決める */
let ocrDrag = null;
function stagePoint(ev){
  const r = ocrCv.getBoundingClientRect();
  const p = ev.touches ? ev.touches[0] : ev;
  return { x: p.clientX - r.left, y: p.clientY - r.top, rect: r };
}
function showSel(a, b){
  const sr = ocrStage.getBoundingClientRect(), cr = ocrCv.getBoundingClientRect();
  const dx = cr.left - sr.left, dy = cr.top - sr.top;
  const x = Math.min(a.x, b.x), y = Math.min(a.y, b.y);
  ocrSel.hidden = false;
  ocrSel.style.left = (dx + x) + "px";
  ocrSel.style.top = (dy + y) + "px";
  ocrSel.style.width = Math.abs(b.x - a.x) + "px";
  ocrSel.style.height = Math.abs(b.y - a.y) + "px";
}
ocrCv.addEventListener("pointerdown", ev => {
  if (!ocrState || ocrBusy) return;
  ev.preventDefault();
  ocrDrag = stagePoint(ev);
  try { ocrCv.setPointerCapture(ev.pointerId); } catch(e){}
  showSel(ocrDrag, ocrDrag);
});
ocrCv.addEventListener("pointermove", ev => {
  if (!ocrDrag) return;
  ev.preventDefault();
  showSel(ocrDrag, stagePoint(ev));
});
ocrCv.addEventListener("pointerup", ev => {
  if (!ocrDrag) return;
  const a = ocrDrag, b = stagePoint(ev);
  ocrDrag = null;
  const rect = { x: Math.min(a.x,b.x), y: Math.min(a.y,b.y), w: Math.abs(b.x-a.x), h: Math.abs(b.y-a.y) };
  if (rect.w < 12 || rect.h < 8){
    ocrSel.hidden = true;
    ocrMsg("囲みが小さすぎます。数字をもう少し大きく囲んでください。");
    return;
  }
  readOcrRegion(rect);
});
ocrCv.addEventListener("pointercancel", () => { ocrDrag = null; ocrSel.hidden = true; });

function loadScript(src){
  return new Promise((ok, ng) => {
    const s = document.createElement("script");
    s.src = src; s.onload = ok; s.onerror = () => ng(new Error("load"));
    document.head.appendChild(s);
  });
}
async function getOcrWorker(){
  if (ocrWorker) return ocrWorker;
  if (!window.Tesseract){
    ocrMsg("読み取り部品を取り寄せています… 初回だけ少し時間がかかります", true);
    await loadScript(OCR_CDN);
  }
  ocrMsg("読み取りの準備をしています…", true);
  ocrWorker = await Tesseract.createWorker("eng", 1);
  await ocrWorker.setParameters({
    tessedit_char_whitelist: "0123456789,.",
    tessedit_pageseg_mode: "7"          // 1行として読む
  });
  return ocrWorker;
}
/* 囲んだ部分を切り出し、拡大して白黒にしてから読ませる */
function cropForOcr(rect){
  const img = ocrState.img, s = ocrState.scale, up = 3;
  const sx = rect.x / s, sy = rect.y / s, sw = rect.w / s, sh = rect.h / s;
  const c = document.createElement("canvas");
  c.width = Math.max(8, Math.round(sw * up));
  c.height = Math.max(8, Math.round(sh * up));
  const cx = c.getContext("2d", { willReadFrequently: true });
  cx.imageSmoothingEnabled = true;
  cx.imageSmoothingQuality = "high";
  cx.drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
  const d = cx.getImageData(0, 0, c.width, c.height), p = d.data;
  let min = 255, max = 0, sum = 0, n = 0;
  for (let i = 0; i < p.length; i += 4){
    const g = p[i]*0.299 + p[i+1]*0.587 + p[i+2]*0.114;
    p[i] = p[i+1] = p[i+2] = g;
    if (g < min) min = g;
    if (g > max) max = g;
    sum += g; n++;
  }
  const range = Math.max(1, max - min), mean = sum / Math.max(1, n);
  const darkBg = mean < 128;            // 黒い画面の証券アプリは白黒を反転させる
  for (let i = 0; i < p.length; i += 4){
    const g = (p[i] - min) / range * 255;
    let v = g < 128 ? 0 : 255;
    if (darkBg) v = 255 - v;
    p[i] = p[i+1] = p[i+2] = v;
  }
  cx.putImageData(d, 0, 0);
  return c;
}
function pickNumber(text){
  const runs = String(text || "").match(/[\d][\d,.\s]*/g) || [];
  let best = "";
  runs.forEach(r => {
    const digits = r.replace(/[^\d]/g, "");
    if (digits.length > best.length) best = digits;
  });
  return best;
}
async function readOcrRegion(rect){
  if (ocrBusy) return;
  ocrBusy = true;
  try {
    const worker = await getOcrWorker();
    ocrMsg("読み取っています…", true);
    const { data } = await worker.recognize(cropForOcr(rect));
    const num = pickNumber(data && data.text);
    ocrSel.hidden = true;
    if (!num){
      ocrMsg("数字を読み取れませんでした。もう少し大きく、数字だけを囲んでみてください。");
      return;
    }
    const f = ocrState.fields[ocrState.idx];
    const inp = document.getElementById(ocrState.bid + "_" + f.k);
    if (inp){
      inp.value = num;
      if (typeof inp.__commit === "function") inp.__commit();
      else inp.dispatchEvent(new Event("input", { bubbles: true }));
    }
    ocrState.done[f.k] = true;
    const next = ocrState.fields.findIndex((v,i) => i > ocrState.idx && !ocrState.done[v.k]);
    const any = ocrState.fields.findIndex(v => !ocrState.done[v.k]);
    ocrState.idx = next >= 0 ? next : (any >= 0 ? any : ocrState.idx);
    renderOcrChips();
    const remain = ocrState.fields.filter(v => !ocrState.done[v.k]).length;
    if (!remain){
      ocrMsg("<b>" + esc(f.label) + " に " + fmtN(+num) + " を入れました。</b> 4つとも入りました。閉じて数字をご確認ください。");
    } else {
      ocrMsg("<b>" + esc(f.label) + " に " + fmtN(+num) + " を入れました。</b> 次は <b>"
             + esc(ocrState.fields[ocrState.idx].label) + "</b> です。");
    }
  } catch(e){
    ocrSel.hidden = true;
    ocrMsg("読み取り部品を用意できませんでした。通信できる場所でもう一度お試しください。");
    diag.err++; diag.last = String(e && e.message || e).slice(0,100);
  } finally {
    ocrBusy = false;
  }
}
document.getElementById("ocrChips").addEventListener("click", ev => {
  const b = ev.target.closest("[data-ocrfield]");
  if (!b || !ocrState) return;
  ocrState.idx = +b.dataset.ocrfield;
  renderOcrChips();
  ocrMsg("次に入れるのは <b>" + esc(ocrState.fields[ocrState.idx].label) + "</b> です。数字を囲んでください。");
});
window.addEventListener("resize", () => { if (ocrState && ocrState.img && !ocrEl.hidden){ drawOcrImage(); ocrSel.hidden = true; } });

function openPad(input){

  else { first.dataset.k = "00"; first.textContent = "00"; first.className = ""; }

function updatePadHead(){
  if (!padTarget) return;

  if (padTarget.dataset.padunit === "code"){

  padVal.textContent = v ? echoText(v, padTarget.dataset.padunit) : "—";
}
function padKey(k){
  if (!padTarget) return;
  if (k === "done"){ closePad(); return; }
  if (k === "next"){ padNext(); return; }
  let v = String(padTarget.value || "");
  let neg = v.charAt(0) === "-";
  if (neg) v = v.slice(1);
  if (k === "sign") neg = !neg;
  else if (k === "back") v = v.slice(0, -1);
  else if (k === "clear"){ v = ""; neg = false; }
  else {
    if (v === "0") v = "";
    if (v.length + k.length > 12) return;
    v = v + k;
  }
  v = v.replace(/^0+(?=\d)/, "");
  padTarget.value = (neg ? "-" : "") + v;
  if (typeof padTarget.__commit === "function") padTarget.__commit();
  updatePadHead();
}
function padNext(){
  const list = Array.prototype.slice.call(main.querySelectorAll("[data-numfield]"));
  const nx = list[list.indexOf(padTarget) + 1];
  if (!nx){ closePad(); return; }
  openPad(nx);
  try { nx.focus({ preventScroll: true }); } catch(e){}
}

function updateCardSum(card, bid){
  const ym = state.month, e = entryOf(ym, bid);
  const b = state.cfg.brokers.find(v => v.id === bid) || {};
  const gainMode = b.input === "gain";
  const g = (+e.value||0) - (+e.cost||0);
  const yocV = e.cost ? (+e.div||0)/e.cost : NaN;
  const avg = e.shares ? (+e.cost||0)/e.shares : NaN;
  const head = gainMode
    ? '<span>取得額 <b class="num">' + ((e.value||e.gain) ? yen(e.cost) : "—") + "</b></span>"
    : '<span>' + ((e.cost||e.value) ? gainWord(g) : "損益") + ' <b class="num ' + dirClass(g) + '">' + (e.cost||e.value ? yenDelta(g) : "—") + "</b></span>";
  card.querySelector(".csum").innerHTML = head
    + '<span>利回り <b class="num">' + (isFinite(yocV) ? pct(yocV) : "—") + "</b></span>"
    + '<span>平均単価 <b class="num">' + (isFinite(avg) ? "¥" + fmtN(avg,1) : "—") + "</b></span>";
}
function updateEntryTotal(){
  const ym = state.month, t = totals(ym);
  const el = document.getElementById("buyTotal");
  if (el) el.textContent = yen(t.invested);
  const c = document.getElementById("buyCount");
  if (c) c.textContent = (getM(ym).buys||[]).length + "件";
  const bud = budgetOf(ym), rest = bud - t.invested;
  const r = document.getElementById("buyRest"), rl = document.getElementById("restLabel");
  if (r){
    r.textContent = bud > 0 ? yen(Math.abs(rest)) : "—";
    r.className = "num " + (bud > 0 && rest < 0 ? "up" : "");
  }
  if (rl) rl.textContent = (bud > 0 && rest < 0) ? "予定を超えた額" : "予定に対する残り";
}
function rebuildBuyRows(){

      + '<div><div class="lbl">現在株価（円）</div><input class="n" data-w="cur" ' + numAttrs("検討中 ・ 現在株価", "円") + ' placeholder="2480" value="' + (w.cur||"") + '"></div>'

    + '</div>';

  const nameIn = card.querySelector('[data-w="name"]');

    const hit = watchHit(w), done = watchBought(w, state.month);
    card.classList.toggle("hit", hit && !done);
    card.querySelector("[data-wdot]").style.background = hit ? "var(--gold)" : "var(--line-2)";
    card.querySelector("[data-wname]").textContent = w.name || w.code || "（未設定）";
    const chip = card.querySelector("[data-wchip]");
    if (done){ chip.className = "chip done"; chip.textContent = "買付済み"; }
    else if (hit){ chip.className = "chip buy"; chip.textContent = "買い時"; }
    else { chip.className = "chip wait"; chip.textContent = (+w.cur) ? "希望まで +¥" + fmtN((+w.cur) - (+w.price||0)) : "現在株価を入れると判定します"; }
    card.querySelector("[data-wsum]").innerHTML =
        "<span>希望での必要額 <b class=\"num\">" + yen(watchNeed(w)) + "</b></span>"
      + ((+w.cur) ? "<span>現在の必要額 <b class=\"num\">" + yen(watchNow(w)) + "</b></span>" : "");
  };

  card.querySelectorAll("[data-w]").forEach(el => {
    const commit = () => {
      const k = el.dataset.w;
      w[k] = (k === "code" || k === "name") ? el.value : parseNum(el.value);
      if (k === "code"){
        const nm = lookupTicker(w.code);

      }

    else { el.addEventListener("input", commit); el.addEventListener("change", commit); }
  });
  nameIn.addEventListener("change", () => { if (w.code && w.name) learnTicker(w.code, w.name); });
  if (w.name && lookupTicker(w.code) !== w.name) nameIn.dataset.auto = "0";

    + '<div style="display:flex;align-items:flex-end"><button class="del" type="button">削除</button></div>';

  const amtEcho = row.querySelector("[data-echo]");
  const nameIn = row.querySelector('[data-k="name"]');
  row.querySelectorAll("[data-k]").forEach(el => {
    const commit = () => {
      const k = el.dataset.k;
      x[k] = (k === "amount" || k === "shares") ? parseNum(el.value) : el.value;
      if (k === "amount") amtEcho.textContent = echoText(x.amount, "円");
      if (k === "code"){
        // コードから銘柄名を引く。手で書いた名前は上書きしない
        const nm = lookupTicker(x.code);
        if (nm && (!nameIn.value.trim() || nameIn.dataset.auto === "1")){
          nameIn.value = nm; nameIn.dataset.auto = "1"; x.name = nm;
        }
      }
      if (k === "name") nameIn.dataset.auto = "0";
      updateEntryTotal(); editingLock = state.month; saveMonth(state.month);
    };
    if (el.classList.contains("n")){
      el.addEventListener("blur", () => { editingLock = null; });
      wireNum(el, commit);
    } else {
      el.addEventListener("input", commit);
      el.addEventListener("change", commit);
    }
  });
  // 手で直した銘柄名は、そのコードの名前として覚える
  nameIn.addEventListener("change", () => { if (x.code && x.name) learnTicker(x.code, x.name); });
  if (x.name && lookupTicker(x.code) !== x.name) nameIn.dataset.auto = "0";
  amtEcho.textContent = echoText(x.amount, "円");
  row.querySelector(".del").addEventListener("click", () => {
    const m = ensureM(state.month);
    m.buys = m.buys.filter(v => v.id !== x.id);
    rebuildBuyRows(); saveMonth(state.month);
  });
  return row;
}

function niceTicks(min, max, n){
  if (!isFinite(min) || !isFinite(max)) return {lo:0, hi:1, ticks:[0,1]};
  if (min === max){ const pad = Math.abs(min)*0.1 || 1; min -= pad; max += pad; }
  const raw = (max - min) / n;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const norm = raw / mag;
  const step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 2.5 ? 2.5 : norm <= 5 ? 5 : 10) * mag;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;
  const ticks = []; for (let v = lo; v <= hi + step/2; v += step) ticks.push(+v.toFixed(10));
  return {lo, hi, ticks};
}
function axisLabel(v, isPct){
  if (isPct) return fmtN(v,2);
  const a = Math.abs(v);
  if (a >= 1e8) return (v/1e8).toFixed(a >= 1e9 ? 0 : 1) + "億";
  if (a >= 1e4) return Math.round(v/1e4) + "万";
  return fmtN(v);
}
function chartFrame(host, opts){
  host.innerHTML = '<div class="ct"><h3>' + esc(opts.title) + "</h3><span>" + esc(opts.note||"") + "</span></div>"
    + (opts.series && opts.series.length > 1 ? '<div class="legend">'
        + opts.series.map(s => '<span style="color:' + s.color + '"><i class="' + (s.dash?"dashed":"") + '" style="background:' + (s.dash?"transparent":s.color) + '"></i><span style="color:var(--ink-2)">' + esc(s.name) + "</span></span>").join("")
        + "</div>" : "")
    + '<div class="cbody"></div><div class="tip"></div>';
  return { body: host.querySelector(".cbody"), tip: host.querySelector(".tip") };
}
function drawLine(host, o){
  const { body, tip } = chartFrame(host, o);
  const isPct = /%/.test(o.note||"");
  const draw = () => {
    const W = Math.max(260, body.clientWidth), H = 190;
    const all = o.series.flatMap(s => s.values).filter(isFinite);
    const sc = niceTicks(Math.min(...all), Math.max(...all), 4);
    const PL = 46, PR = 14, PT = 12, PB = 26;
    const n = o.labels.length;
    const x = i => n === 1 ? (PL + (W-PL-PR)/2) : PL + (W-PL-PR) * i/(n-1);
    const y = v => PT + (H-PT-PB) * (1 - (v - sc.lo)/(sc.hi - sc.lo || 1));
    let s = '<svg viewBox="0 0 ' + W + " " + H + '" width="' + W + '" height="' + H + '" role="img" aria-label="' + esc(o.title) + '">';
    sc.ticks.forEach(t => {
      s += '<line x1="' + PL + '" y1="' + y(t).toFixed(1) + '" x2="' + (W-PR) + '" y2="' + y(t).toFixed(1) + '" stroke="var(--grid)" stroke-width="1"/>';
      s += '<text class="ctext" x="' + (PL-7) + '" y="' + (y(t)+3.4).toFixed(1) + '" text-anchor="end">' + axisLabel(t, isPct) + "</text>";
    });
    if (o.band && o.series.length === 2){
      const a = o.series[0].values, b = o.series[1].values;
      let p = "";
      for (let i=0;i<n;i++) p += (i?"L":"M") + x(i).toFixed(1) + "," + y(a[i]).toFixed(1);
      for (let i=n-1;i>=0;i--) p += "L" + x(i).toFixed(1) + "," + y(b[i]).toFixed(1);
      s += '<path d="' + p + 'Z" fill="' + o.series[0].color + '" fill-opacity="0.13" stroke="none"/>';
    }
    o.series.forEach(se => {
      let p = "";
      se.values.forEach((v,i) => { p += (i?"L":"M") + x(i).toFixed(1) + "," + y(v).toFixed(1); });
      s += '<path d="' + p + '" fill="none" stroke="' + se.color + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"' + (se.dash ? ' stroke-dasharray="5 4"' : "") + "/>";
      const li = n-1;
      s += '<circle cx="' + x(li).toFixed(1) + '" cy="' + y(se.values[li]).toFixed(1) + '" r="4" fill="' + se.color + '" stroke="var(--surface)" stroke-width="2"/>';
    });
    o.labels.forEach((l,i) => {
      if (n > 6 && i % Math.ceil(n/6) !== 0 && i !== n-1) return;
      const tx = Math.min(W-PR, Math.max(PL, x(i)));
      s += '<text class="ctext" x="' + tx.toFixed(1) + '" y="' + (H-8) + '" text-anchor="' + (i===0?"start":i===n-1?"end":"middle") + '">' + esc(l.replace(/^\d{4}年/,"")) + "</text>";
    });
    s += '<line class="cross" x1="0" y1="' + PT + '" x2="0" y2="' + (H-PB) + '" stroke="var(--ink-3)" stroke-width="1" stroke-dasharray="3 3" opacity="0"/>';
    s += "</svg>";
    body.innerHTML = s;
    const svg = body.querySelector("svg"), cross = svg.querySelector(".cross");
    const move = ev => {
      const r = svg.getBoundingClientRect();
      const px = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left;
      const sx = px * (W / r.width);
      let best = 0, bd = Infinity;
      for (let i=0;i<n;i++){ const d = Math.abs(x(i)-sx); if (d<bd){ bd=d; best=i; } }
      cross.setAttribute("x1", x(best).toFixed(1)); cross.setAttribute("x2", x(best).toFixed(1));
      cross.setAttribute("opacity", "1");
      tip.innerHTML = "<b>" + esc(o.labels[best]) + "</b>"
        + o.series.map(se => '<div class="l"><i style="background:' + se.color + '"></i>' + esc(se.name) + "<span>" + o.fmt(se.values[best]) + "</span></div>").join("");
      tip.style.opacity = "1";
      const hostW = host.clientWidth, tw = tip.offsetWidth || 150;
      let left = (x(best) / W) * r.width + (r.left - host.getBoundingClientRect().left) - tw/2;
      left = Math.max(6, Math.min(hostW - tw - 6, left));
      tip.style.left = left + "px"; tip.style.top = "26px";
    };
    svg.addEventListener("mousemove", move);
    svg.addEventListener("touchstart", move, {passive:true});
    svg.addEventListener("touchmove", move, {passive:true});
    svg.addEventListener("mouseleave", () => { tip.style.opacity = "0"; cross.setAttribute("opacity","0"); });
    svg.addEventListener("touchend", () => { tip.style.opacity = "0"; cross.setAttribute("opacity","0"); });
  };
  draw();
  if (window.ResizeObserver){ const ro = new ResizeObserver(() => draw()); ro.observe(body); }
}
function drawBars(host, o){
  const { body, tip } = chartFrame(host, o);
  const draw = () => {
    const W = Math.max(260, body.clientWidth), H = 180;
    const sc = niceTicks(0, Math.max(...o.values, 1), 4);
    const PL = 46, PR = 14, PT = 12, PB = 26, n = o.values.length;
    const iw = (W-PL-PR)/n, bw = Math.min(30, Math.max(6, iw - 8));
    const y = v => PT + (H-PT-PB) * (1 - (v - sc.lo)/(sc.hi - sc.lo || 1));
    let s = '<svg viewBox="0 0 ' + W + " " + H + '" width="' + W + '" height="' + H + '" role="img" aria-label="' + esc(o.title) + '">';
    sc.ticks.forEach(t => {
      s += '<line x1="' + PL + '" y1="' + y(t).toFixed(1) + '" x2="' + (W-PR) + '" y2="' + y(t).toFixed(1) + '" stroke="var(--grid)" stroke-width="1"/>';
      s += '<text class="ctext" x="' + (PL-7) + '" y="' + (y(t)+3.4).toFixed(1) + '" text-anchor="end">' + axisLabel(t) + "</text>";
    });
    o.values.forEach((v,i) => {
      const cx = PL + iw*i + iw/2, h = Math.max(0, y(sc.lo) - y(v));
      s += '<rect x="' + (cx-bw/2).toFixed(1) + '" y="' + y(v).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + h.toFixed(1) + '" rx="4" ry="4" fill="' + o.color + '"/>';
    });
    o.labels.forEach((l,i) => {
      if (n > 6 && i % Math.ceil(n/6) !== 0 && i !== n-1) return;
      s += '<text class="ctext" x="' + (PL + iw*i + iw/2).toFixed(1) + '" y="' + (H-8) + '" text-anchor="middle">' + esc(l.replace(/^\d{4}年/,"")) + "</text>";
    });
    s += "</svg>";
    body.innerHTML = s;
    const svg = body.querySelector("svg");
    const move = ev => {
      const r = svg.getBoundingClientRect();
      const px = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left;
      const sx = px * (W / r.width);
      const i = Math.max(0, Math.min(n-1, Math.floor((sx - PL)/iw)));
      tip.innerHTML = "<b>" + esc(o.labels[i]) + '</b><div class="l"><i style="background:' + o.color + '"></i>' + esc(o.title) + "<span>" + o.fmt(o.values[i]) + "</span></div>";
      tip.style.opacity = "1";
      const hostW = host.clientWidth, tw = tip.offsetWidth || 150;
      let left = ((PL + iw*i + iw/2) / W) * r.width + (r.left - host.getBoundingClientRect().left) - tw/2;
      left = Math.max(6, Math.min(hostW - tw - 6, left));
      tip.style.left = left + "px"; tip.style.top = "26px";
    };
    svg.addEventListener("mousemove", move);
    svg.addEventListener("touchstart", move, {passive:true});
    svg.addEventListener("touchmove", move, {passive:true});
    svg.addEventListener("mouseleave", () => tip.style.opacity = "0");
    svg.addEventListener("touchend", () => tip.style.opacity = "0");
  };
  draw();
  if (window.ResizeObserver){ const ro = new ResizeObserver(() => draw()); ro.observe(body); }
}

function buildCsv(){
  const keys = filledMonths();
  const head = ["月","証券会社","総投資額","時価評価額","年間配当","保有株数"];
  const lines = [head.join(",")];
  keys.forEach(k => {
    state.cfg.brokers.forEach(b => {
      const e = entryOf(k, b.id);
      if (e.cost||e.value||e.div||e.shares)
        lines.push([k, '"'+String(b.name).replace(/"/g,'""')+'"', e.cost||0, e.value||0, e.div||0, e.shares||0].join(","));
    });
  });
  lines.push("");
  lines.push(["月","証券コード","銘柄","証券会社","買付金額","株数"].join(","));
  keys.forEach(k => (getM(k).buys||[]).forEach(x => {
    const b = state.cfg.brokers.find(v=>v.id===x.bid);
    lines.push([k, '"'+String(x.code||"")+'"', '"'+String(x.name||"").replace(/"/g,'""')+'"', '"'+String(b?b.name:"").replace(/"/g,'""')+'"', x.amount||0, x.shares||0].join(","));
  }));
  return "﻿" + lines.join("\r\n");
}
async function saveFile(name, text, mime){
  if (downloads){
    try { await downloads.save({ filename: name, data: text }); flashSaved("書き出しました"); return true; }
    catch(e){ if (e && e.code === "declined") return true; }
  }
  // 自分のサーバーに置いた場合は、ブラウザの保存機能をそのまま使える
  if (typeof window.claude === "undefined"){
    try {
      const url = URL.createObjectURL(new Blob([text], {type: mime}));
      const a = document.createElement("a");
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      flashSaved("書き出しました");
      return true;
    } catch(e){}
  }
  return false;
}
async function doCsv(){
  const ok = await saveFile("kabutocho_" + ymNow().replace("-","") + ".csv", buildCsv(), "text/csv");
  if (!ok) showJson("この画面ではファイルの保存ができません。下のバックアップをコピーして保存してください。");
}
async function doJson(){
  const ok = await saveFile("kabutocho_backup_" + ymNow().replace("-","") + ".json",
                            JSON.stringify(snapshot(), null, 1), "application/json");
  if (!ok) showJson("この画面ではファイルの保存ができません。下のバックアップをコピーして保存してください。");
}
/* バックアップの文字列から書き戻す。ファイルからでも貼り付けからでも同じ道を通す */
function restoreFrom(text){
  let d;
  try { d = JSON.parse(String(text || "")); } catch(e){ return false; }
  if (!d || !d.cfg || !Array.isArray(d.cfg.brokers) || !d.cfg.brokers.length) return false;
  const c = d.cfg;
  state.cfg = {
    brokers: c.brokers,
    goalDividend: +c.goalDividend || 0,
    monthlyBudget: +c.monthlyBudget || 0,
    tickers: c.tickers || {},
    watch: Array.isArray(c.watch) ? c.watch : []
  };
  state.months = (d.months && typeof d.months === "object") ? d.months : {};
  state.demo = false;
  const f = filledMonths();
  if (f.length) state.month = f[f.length - 1];
  entryBuiltFor = ""; closePad();
  scheduleSave(Object.keys(state.months), true);
  render();
  return true;
}
function showJson(msg){
  const box = document.getElementById("ioBox");
  if (!box) return;
  box.innerHTML = (msg ? '<div class="help" style="margin-bottom:8px;color:var(--warn)">' + esc(msg) + "</div>" : "")
    + '<textarea class="io" id="jsonBox" spellcheck="false"></textarea>'
    + '<div class="btnrow" style="margin-top:8px"><button class="btn" data-act="restore">この内容で復元する</button></div>'
    + '<div class="help">貼り付けて復元することもできます。</div>';
  document.getElementById("jsonBox").value = JSON.stringify(snapshot());
}

document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act;
  if (a === "goEntry"){
    const was = exitDemo();
    state.tab = "entry"; render();
    if (was) flashSaved("サンプルを消しました");
  }
  else if (a === "goSet"){ state.tab = "set"; render(); }
  else if (a === "clearDemo"){
    exitDemo(); render();
    flashSaved("サンプルを消しました");
  }
  else if (a === "copyPrev"){
    const prev = prevFilled(state.month);
    if (!prev) return;
    const m = ensureM(state.month), src = getM(prev);
    state.cfg.brokers.forEach(b => {
      const e = src.entries[b.id] || {};
      const row = { cost:+e.cost||0, value:+e.value||0, div:+e.div||0, shares:+e.shares||0 };
      if (b.input === "gain") row.gain = row.value - row.cost;
      m.entries[b.id] = row;
    });
    entryBuiltFor = ""; saveMonth(state.month); render();
    flashSaved(ymLabel(prev) + "の値を入れました");
  }
  else if (a === "applyAll"){
    const prev = prevFilled(state.month);
    if (!prev){ flashSaved("前月のデータがありません"); return; }
    const m = ensureM(state.month), src = getM(prev);
    state.cfg.brokers.forEach(b => {
      const e = src.entries[b.id] || {};
      const amt = (m.buys||[]).filter(x=>x.bid===b.id).reduce((s,x)=>s+(+x.amount||0),0);
      const sh  = (m.buys||[]).filter(x=>x.bid===b.id).reduce((s,x)=>s+(+x.shares||0),0);
      const cur = m.entries[b.id] || {};
      const row = {
        cost: (+e.cost||0) + amt,
        value: cur.value || ((+e.value||0) + amt),
        div: cur.div || (+e.div||0),
        shares: (+e.shares||0) + sh
      };
      if (b.input === "gain"){
        // 損益で入力する会社は、前月の損益を据え置いて取得額を出す
        row.gain = (cur.gain !== undefined) ? +cur.gain : ((+e.value||0) - (+e.cost||0));
        row.cost = row.value - row.gain;
      }
      m.entries[b.id] = row;
    });
    entryBuiltFor = ""; saveMonth(state.month); render();
    flashSaved("前月＋買付で埋めました");
  }
  else if (a === "addBuy"){
    const m = ensureM(state.month);
    const x = { id: uid(), code:"", name:"", bid: (state.cfg.brokers[0]||{}).id, amount:0, shares:0 };
    m.buys.push(x);
    const host = document.getElementById("buyRows");
    if (host && host.querySelector(".help")) host.innerHTML = "";
    const row = buyRowEl(x); host.appendChild(row);
    row.querySelector("input").focus();
    updateEntryTotal(); saveMonth(state.month);
  }
  else if (a === "mask"){
    setMask(!maskOn());
    render();
  }
  else if (a === "ocr"){ closePad(); openOcr(el.dataset.bid); }
  else if (a === "ocrClose"){ closeOcr(); flashSaved("読み取った数字をご確認ください"); }
  else if (a === "addWatch"){
    const w = { id: uid(), code:"", name:"", price:0, qty:0, cur:0 };
    watchList().push(w);
    const host = document.getElementById("watchRows");
    if (host && host.querySelector(".help")) host.innerHTML = "";
    const row = watchRowEl(w);
    host.appendChild(row);
    const c = document.getElementById("watchCount");
    if (c) c.textContent = watchList().length + "件";
    row.querySelector("input").focus();
    saveCfg();
  }
  else if (a === "watchDel"){
    const w = watchList().find(v => v.id === el.dataset.id);
    if (!w) return;
    confirmBox((w.name || w.code || "この銘柄") + " を検討中から外します。", "外す", () => {
      state.cfg.watch = watchList().filter(v => v.id !== w.id);
      closePad(); rebuildWatchRows(); saveCfg();
      flashSaved("外しました");
    });
  }
  else if (a === "watchBuy"){
    const w = watchList().find(v => v.id === el.dataset.id);
    if (!w) return;
    const m = ensureM(state.month);
    const unit = (+w.cur) || (+w.price) || 0;
    const x = { id: uid(), code: w.code || "", name: w.name || "",
                bid: (state.cfg.brokers[0]||{}).id, amount: Math.round(unit * (+w.qty||0)), shares: +w.qty||0 };
    m.buys.push(x);
    closePad(); rebuildBuyRows(); rebuildWatchRows();
    saveMonth(state.month);
    flashSaved((w.name || w.code || "銘柄") + " を買付に入れました");
    const host = document.getElementById("buyRows");
    if (host && host.lastElementChild) host.lastElementChild.scrollIntoView({block:"center"});
  }
  else if (a === "saveJson"){ doJson(); }
  else if (a === "pickFile"){
    const inp = document.getElementById("restoreFile");
    if (inp) inp.click();
  }
  else if (a === "addBroker"){
    const id = "b" + uid();
    state.cfg.brokers.push({ id, name: "証券会社 " + (state.cfg.brokers.length + 1) });
    saveCfg(); render();
  }
  else if (a === "delBroker"){
    const b = state.cfg.brokers.find(v => v.id === el.dataset.id);
    if (!b) return;
    confirmBox(b.name + " を一覧から外します。過去の月に入力した " + b.name + " の数字も集計に入らなくなります。", "外す", () => {
      state.cfg.brokers = state.cfg.brokers.filter(v => v.id !== b.id);
      saveCfg(); render(); flashSaved(b.name + " を外しました");
    });
  }
  else if (a === "theme"){
    try { localStorage.setItem(LS + ".theme", el.dataset.v); } catch(e){}
    applyTheme(); render();
  }
  else if (a === "csv") doCsv();
  else if (a === "showJson") showJson("");
  else if (a === "restore"){
    const box = document.getElementById("jsonBox");
    flashSaved(restoreFrom(box ? box.value : "") ? "復元しました" : "読み取れませんでした");
  }
  else if (a === "delMonth"){
    const ym = state.month;
    confirmBox(ymLabel(ym) + "の記録を消します。他の月はそのままです。", "この月を消す", () => {
      const key = "months/" + ym.replace("-","_");
      delete state.months[ym];
      savePaths.delete(ym); queue.delete(key);
      closePad(); saveLocal();
      if (db) db.doc(key).delete().catch(()=>{});
      entryBuiltFor = ""; render();
      flashSaved(ymLabel(ym) + "を消しました");
    });
  }
  else if (a === "wipe"){
    confirmBox("すべての月の記録を消します。元に戻せません。証券会社の一覧は残ります。", "すべて消す", () => {
      const old = Object.keys(state.months);
      state.months = {}; state.demo = false; entryBuiltFor = ""; state.month = ymNow();
      saveLocal();
      if (db) old.forEach(k => { db.doc("months/" + k.replace("-","_")).delete().catch(()=>{}); });
      render(); flashSaved("消去しました");
    });
  }
});

document.getElementById("tabs").addEventListener("click", ev => {
  const b = ev.target.closest("button[data-tab]"); if (!b) return;
  closePad();
  let msg = "";
  if (b.dataset.tab === "entry" && exitDemo()) msg = "サンプルを消しました";
  state.tab = b.dataset.tab; render();
  if (msg) flashSaved(msg);
});
document.getElementById("prevM").addEventListener("click", () => { closePad(); state.month = ymAdd(state.month,-1); entryBuiltFor=""; render(); });
document.getElementById("nextM").addEventListener("click", () => {
  if (state.month >= ymNow()) return;
  closePad(); state.month = ymAdd(state.month, 1); entryBuiltFor=""; render();
});
document.getElementById("mPick").addEventListener("change", ev => {
  if (ev.target.value){ closePad(); state.month = ev.target.value; entryBuiltFor=""; render(); }
});
document.getElementById("themeBtn").addEventListener("click", cycleTheme);

boot();
</script>
